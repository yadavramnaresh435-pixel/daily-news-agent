name: Daily Hindu Research Digest

on:
  schedule:
    # Roz subah IST 9:00 AM (UTC 3:30 AM) par chalega
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Phase 6.0 — Cross Repository Integration (optional).
          # If WEBSITE_REPO / WEBSITE_REPO_TOKEN are not set, website
          # publishing is skipped automatically and the rest of the run
          # (Telegram, memory) is unaffected.
          WEBSITE_REPO: ${{ secrets.WEBSITE_REPO }}
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          WEBSITE_REPO_BRANCH: ${{ secrets.WEBSITE_REPO_BRANCH }}
